name: Deploy Portfolio Website

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare standalone bundle
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          rsync -azP --delete --exclude '.env*' \
            .next/standalone/ \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${{ secrets.APP_DIR }}/

      - name: Restart application
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            source ~/.nvm/nvm.sh
            nvm use 24
            cd ${{ secrets.APP_DIR }}
            # check if next-portfolio-app is running
            if pm2 list | grep -q "next-portfolio-app"; then
              pm2 restart next-portfolio-app
            else
              PORT=3000 pm2 start server.js --name next-portfolio-app
            fi
            pm2 save
            echo "Deployment finished!"
          EOF
